<!DOCTYPE html>
<html lang="th">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>ติดต่อเรา</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

<style>

body{
background:#f5f5f5;
}

/* banner */
.banner{
height:250px;
background:url("https://images.unsplash.com/photo-1524985069026-dd778a71c7b4") center/cover;
display:flex;
align-items:center;
justify-content:center;
position:relative;
}

.banner::before{
content:"";
position:absolute;
width:100%;
height:100%;
background:rgba(0,0,0,0.55);
}

.banner h1{
position:relative;
color:white;
font-size:36px;
font-weight:bold;
}

/* form card */
.contact-card{
border-radius:15px;
transition:0.3s;
}

.contact-card:hover{
box-shadow:0 10px 25px rgba(0,0,0,0.2);
}

/* button */
.btn-success{
padding:10px 30px;
border-radius:25px;
}

/* footer */
footer img{
margin:10px;
transition:0.3s;
}

footer img:hover{
transform:scale(1.2);
}

</style>

</head>

<body>

<!-- NAVBAR -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">

<div class="container">

<a class="navbar-brand fw-bold" href="index.html">SPU SIT</a>

<button class="navbar-toggler" data-bs-toggle="collapse" data-bs-target="#menu">
<span class="navbar-toggler-icon"></span>
</button>

<div class="collapse navbar-collapse" id="menu">

<ul class="navbar-nav ms-auto">

<li class="nav-item">
<a class="nav-link" href="index.html">หน้าแรก</a>
</li>

<li class="nav-item">
<a class="nav-link active">ติดต่อเรา</a>
</li>

</ul>

</div>
</div>
</nav>


<!-- BANNER -->
<div class="banner">
<h1>ติดต่อเรา</h1>
</div>


<!-- CONTACT FORM -->
<div class="container mt-5">

<div class="row justify-content-center">

<div class="col-md-6">

<div class="card shadow p-4 contact-card">

<h4 class="text-center mb-4">ส่งข้อความถึงเรา</h4>

<form>

<div class="mb-3">
<label class="form-label">ชื่อ-นามสกุล</label>
<input type="text" class="form-control" placeholder="กรอกชื่อของคุณ">
</div>

<div class="mb-3">
<label class="form-label">อีเมล</label>
<input type="email" class="form-control" placeholder="example@email.com">
</div>

<div class="mb-3">
<label class="form-label">ข้อความ</label>
<textarea class="form-control" rows="4" placeholder="พิมพ์ข้อความของคุณ"></textarea>
</div>

<div class="text-center">
<button class="btn btn-success">
ส่งข้อความ
</button>
</div>

</form>

</div>

</div>
</div>

</div>


<!-- FOOTER -->
<footer class="bg-dark text-white text-center p-4 mt-5">

</body>
</html>
